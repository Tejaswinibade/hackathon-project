package com.tejaswini;

import com.fasterxml.jackson.databind.JsonNode;
import com.fasterxml.jackson.databind.ObjectMapper;
import java.util.ArrayList;
import java.util.HashMap;
import java.util.List;
import java.util.Map;
import org.springframework.beans.factory.annotation.Value;
import org.springframework.stereotype.Service;
import software.amazon.awssdk.awscore.exception.AwsServiceException;
import software.amazon.awssdk.core.SdkBytes;
import software.amazon.awssdk.regions.Region;
import software.amazon.awssdk.services.bedrockruntime.BedrockRuntimeClient;
import software.amazon.awssdk.services.bedrockruntime.model.InvokeModelRequest;
import software.amazon.awssdk.services.bedrockruntime.model.InvokeModelResponse;

@Service
public class BedrockService {

    private final ObjectMapper objectMapper = new ObjectMapper();

    @Value("${aws.region:us-east-1}")
    private String awsRegion;

    @Value("${aws.model-id:anthropic.claude-3-5-sonnet-20240620-v1:0}")
    private String modelId;

    public String getRecommendations(String mood, String audience, String time, String genre, String extra) {
        String prompt = buildPrompt(mood, audience, time, genre, extra);

        try (BedrockRuntimeClient client = BedrockRuntimeClient.builder()
                .region(Region.of(awsRegion))
                .build()) {

            Map<String, Object> payload = new HashMap<>();
            payload.put("anthropic_version", "bedrock-2023-05-31");
            payload.put("max_tokens", 500);

            Map<String, Object> message = new HashMap<>();
            message.put("role", "user");

            List<Map<String, Object>> content = new ArrayList<>();
            Map<String, Object> textNode = new HashMap<>();
            textNode.put("type", "text");
            textNode.put("text", prompt);
            content.add(textNode);

            message.put("content", content);

            List<Map<String, Object>> messages = new ArrayList<>();
            messages.add(message);
            payload.put("messages", messages);

            String jsonBody = objectMapper.writeValueAsString(payload);
            InvokeModelRequest request = InvokeModelRequest.builder()
                    .modelId(modelId)
                    .contentType("application/json")
                    .accept("application/json")
                    .body(SdkBytes.fromUtf8String(jsonBody))
                    .build();

            InvokeModelResponse response = client.invokeModel(request);
            String responseBody = response.body().asUtf8String();
            JsonNode root = objectMapper.readTree(responseBody);
            JsonNode contentNode = root.get("content");

            if (contentNode != null && contentNode.isArray() && contentNode.size() > 0) {
                return contentNode.get(0).get("text").asText();
            }

            return "No recommendation available. Please try again.";

        } catch (AwsServiceException exc) {
            String errorCode = exc.awsErrorDetails() != null ? exc.awsErrorDetails().errorCode() : "Unknown";
            String errorMessage = exc.getMessage();

            if ("AccessDeniedException".equals(errorCode)) {
                return "AWS Access Error: Check that Bedrock model access is enabled in your AWS console for region " + awsRegion + ".";
            }
            if ("ValidationException".equals(errorCode) || "ModelNotFoundException".equals(errorCode) || "ModelNotFound".equals(errorCode)) {
                return "Model Error: The Claude 3.5 Sonnet model is not available. Enable it in AWS Bedrock console.";
            }
            return "AWS Bedrock Error (" + errorCode + "): " + errorMessage;
        } catch (Exception exc) {
            return "AWS Bedrock Error: " + exc.getMessage();
        }
    }

    private String buildPrompt(String mood, String audience, String time, String genre, String extra) {
        return "You are an expert Fire TV content curator with deep knowledge of streaming libraries. "
                + "Your job is to recommend 5 specific shows, movies, or documentaries based on the user's preferences. "
                + "\n\nUser Profile:"
                + "\n- Mood: " + mood
                + "\n- Audience: " + audience
                + "\n- Time of day: " + time
                + "\n- Genre preference: " + genre
                + "\n- Additional notes: " + (extra == null || extra.isBlank() ? "None" : extra)
                + "\n\nFor each recommendation, provide:"
                + "\n1. Title and media type (Show/Movie/Documentary)"
                + "\n2. Why it fits their mood and preferences"
                + "\n3. Optimal watch time (how long, when best to watch)"
                + "\n4. Quick one-liner about the plot or theme"
                + "\n\nMake recommendations specific, thoughtful, and actionable. Format them clearly and engagingly.";
    }
}
